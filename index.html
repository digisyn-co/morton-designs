<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morton — Website Design Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#08090C;color:#EAEAEA;font-family:'Jost',system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:28px clamp(20px,4vw,64px);display:flex;justify-content:space-between;align-items:center;gap:16px}
header img{height:26px;filter:brightness(0) invert(1)}
header span{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.5}
main{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:clamp(28px,4vw,56px);color:inherit;text-decoration:none;border-top:1px solid rgba(255,255,255,.12);min-height:60vh;transition:background .35s ease}
.card+.card{border-left:1px solid rgba(255,255,255,.12)}
.card:hover{background:rgba(255,255,255,.04)}
.k{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.5}
h2{margin:0;font-size:clamp(44px,5.5vw,84px);line-height:.95;text-transform:uppercase}
.editorial h2{font-family:'Instrument Serif',serif;font-weight:400}
.modern h2{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-.04em}
.quiet h2{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;text-transform:none}
p{margin:0;opacity:.65;font-weight:300}
.go{font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.editorial .go{color:#C5B382}.modern .go{color:#F2B632}.quiet .go{color:#F7F5F0}
footer{padding:18px clamp(20px,4vw,64px);font-size:12px;border-top:1px solid rgba(255,255,255,.12);opacity:.45}
footer a{color:inherit}
</style>
</head>
<body>
<header><img src="modern/assets/logo/morton-lockup.png" alt="Morton"><span>Website design concepts</span></header>
<main>
  <a class="card editorial" href="editorial/index.html"><span class="k">Concept 01</span><h2>Editorial</h2><p>Classic serif, restrained gold. Home + Family Law.</p><span class="go">View concept &rarr;</span></a>
  <a class="card modern" href="modern/index.html"><span class="k">Concept 02</span><h2>Modern</h2><p>Bold grotesk, amber accent. 7 pages.</p><span class="go">View concept &rarr;</span></a>
  <a class="card quiet" href="quiet/index.html"><span class="k">Concept 03</span><h2>Quiet</h2><p>Light, minimal, understated. 7 pages.</p><span class="go">View concept &rarr;</span></a>
</main>
<footer>Morton Law · <a href="docs/image-prompts.html">Image prompt brief</a></footer>
</body>
</html>
